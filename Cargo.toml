[package]
name = "icode"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A Rust implementation of the iCode terminal coding agent"
license = "Apache-2.0"
repository = "https://github.com/jerryrual/AgentStudy"

[lib]
name = "icode"
path = "src/lib.rs"

[[bin]]
name = "icode"
path = "src/main.rs"

[dependencies]
agent-client-protocol = { version = "5.0.0", features = ["stdio"] }
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
crossterm = "0.29.0"
dirs = "7.0.0"
futures-util = "0.3.34"
fs2 = "0.4.3"
globset = "0.4.21"
ignore = "0.4.34"
ratatui = "0.30.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "sync", "net", "signal"] }
unicode-width = "0.2.3"

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(unix)".dependencies]
libc = "0.2.191"
